<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex"><title>Moving to the new home…</title>
<style>body{margin:0;font:18px/1.5 system-ui,sans-serif;background:#111;color:#eee;display:grid;place-items:center;min-height:100vh;text-align:center}
main{padding:24px;max-width:420px}a{display:block;margin:12px 0;padding:14px;border-radius:12px;background:#3b82f6;color:#fff;text-decoration:none;font-weight:700}</style></head>
<body><main><h1>Polly's Polygon Playground has moved</h1><p id="m">Taking your progress with you…</p><div id="pick"></div></main>
<script>
/* Platform v6 Phase 4: this address moved under the family hub. Pack this device's saved progress into the URL
   fragment (never sent to any server) and open the room at its new address; the hub's carry.js copies it in. */
(function () {
  var HUB = 'https://ballirim.vercel.app', CFG = {"base": "/go/math3/", "title": "Polly's Polygon Playground"};
  function pack() {
    var o = {};
    try { for (var i = 0; i < localStorage.length; i++) { var k = localStorage.key(i); if (k && k.indexOf('ks:') !== 0) o[k] = localStorage.getItem(k); } } catch (e) {}
    if (!Object.keys(o).length) return '';
    var bytes = new TextEncoder().encode(JSON.stringify(o)), bin = '';
    for (var j = 0; j < bytes.length; j++) bin += String.fromCharCode(bytes[j]);
    return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }
  function sub(p) {
    p = p.replace(/^\/+/, '');
    if (p && !/\.[a-z0-9]+$/i.test(p) && !/\/$/.test(p)) p += '.html';   // old site used clean URLs
    if (p === 'index.html') p = '';
    return p;
  }
  function go(base) {
    var c = pack(), h = location.hash.replace(/^#/, '');
    var url = HUB + base + sub(location.pathname) + location.search;
    if (c) url += '#carry=' + c + (h ? '&h=' + encodeURIComponent(h) : '');
    else if (h) url += '#' + h;
    location.replace(url);
  }
  if (CFG.byGrade) {
    var g = null;
    try { g = (JSON.parse(localStorage.getItem(CFG.byGrade.key) || '{}') || {}).grade; } catch (e) {}
    if (CFG.byGrade.map[g]) return go(CFG.byGrade.map[g]);
    document.getElementById('m').textContent = 'Who is writing on this device?';
    Object.keys(CFG.byGrade.choices).forEach(function (label) {
      var a = document.createElement('a'); a.href = '#'; a.textContent = label;
      a.onclick = function (e) { e.preventDefault(); go(CFG.byGrade.choices[label]); };
      document.getElementById('pick').appendChild(a);
    });
    return;
  }
  go(CFG.base);
})();
</script></body></html>
