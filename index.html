<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7C3AED">
<title>Fuzzy Buddies Shape Club</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#1E1B4B;--muted:#4B5563;--bg:#F3F0FF;--card:#fff;--purple:#7C3AED;--teal:#0D9488;--coral:#E11D48;--sun:#F59E0B;--green:#16A34A;--sky:#2563EB;--r:18px;
font-family:'Fredoka','Baloo 2','Nunito','Trebuchet MS','Segoe UI',system-ui,-apple-system,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
body{font-size:18px;line-height:1.3;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none;touch-action:manipulation}
button:focus-visible{outline:4px solid #A78BFA;outline-offset:2px}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh}
.topbar{display:flex;align-items:center;gap:8px;padding:6px 10px;background:#fff;box-shadow:0 2px 0 #E4DEFF;z-index:5;flex:none}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:22px;color:var(--purple);padding:2px 6px;border-radius:12px}
.brand svg{width:42px;height:42px}
.brand span b{color:var(--sun)}
.spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;background:#FEF3C7;border-radius:999px;padding:6px 12px;font-weight:600;font-size:18px;white-space:nowrap}
.pill svg{width:22px;height:22px}
.pill.streak{background:#FFEDD5}
.pill.pop{animation:pop .4s}
.iconbtn{width:48px;height:48px;border-radius:14px;background:#EDE9FE;display:grid;place-items:center;flex:none}
.iconbtn svg{width:28px;height:28px}
main{flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch}
/* home */
.home{padding:10px;display:flex;flex-direction:column;gap:10px}
.hero{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,#6D28D9,#2563EB);color:#fff;border-radius:var(--r);padding:12px 18px;position:relative;overflow:hidden}
.hero .mascot{width:110px;height:110px}
.hero h1{margin:0;font-size:34px}
.hero p{margin:2px 0 8px;font-size:19px;opacity:.95}
.hero .pill{background:rgba(255,255,255,.2);color:#fff}
.hero-deco{position:absolute;right:-20px;top:-20px;width:220px;height:180px;opacity:.18}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.card{background:#fff;border-radius:var(--r);padding:12px 14px;text-align:left;display:grid;grid-template-columns:72px 1fr;gap:4px 12px;align-items:center;border-bottom:5px solid var(--c);box-shadow:0 2px 10px rgba(30,27,75,.06);transition:transform .15s}
.card:active{transform:scale(.97)}
.card .icon{width:72px;height:72px;grid-row:span 2}
.card h3{margin:0;font-size:22px;color:var(--c)}
.card p{margin:0;color:var(--muted);font-size:16px}
.card .lvrow{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:4px}
.lvchip{background:#F5F3FF;border-radius:10px;padding:3px 8px;font-size:15px;font-weight:500}
.lvchip .st{color:#F59E0B;letter-spacing:1px}
.tag{margin-left:auto;font-size:13px;font-weight:600;color:#fff;background:var(--c);border-radius:8px;padding:2px 8px}
.bar{height:10px;border-radius:99px;background:#EDE9FE;overflow:hidden;grid-column:1/-1}
.bar i{display:block;height:100%;background:var(--c,#7C3AED);border-radius:99px;transition:width .6s}
/* activity */
.actbar{display:flex;align-items:center;gap:8px;padding:8px 10px;flex-wrap:wrap}
.back{padding:8px 14px;border-radius:14px;background:#fff;font-weight:600;min-height:48px;box-shadow:0 2px 0 #DDD6FE}
.act-title{font-weight:700;font-size:24px}
.levels{display:flex;gap:6px;flex-wrap:wrap}
.lvl{padding:6px 12px;border-radius:14px;background:#fff;font-weight:600;border:3px solid #DDD6FE;min-height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05;font-size:16px}
.lvl small{color:#F59E0B;font-size:14px;letter-spacing:1px}
.lvl.on{background:var(--c);color:#fff;border-color:var(--c)}
.lvl.on small{color:#FEF08A}
.dots{display:flex;gap:6px;margin-left:auto;align-items:center}
.dot{width:16px;height:16px;border-radius:50%;background:#DDD6FE;transition:all .3s}
.dot.done{background:var(--green)}
.dot.cur{background:var(--sun);transform:scale(1.25)}
.act{flex:1;display:grid;grid-template-columns:minmax(0,1.55fr) minmax(320px,1fr);grid-template-rows:minmax(0,1fr);gap:10px;padding:0 10px 10px;min-height:0}
.actscreen{display:flex;flex-direction:column;height:100%}
.panel{overflow:auto}
.stage{background:#fff;border-radius:var(--r);position:relative;touch-action:none;overflow:hidden;min-height:0;display:flex;box-shadow:0 2px 10px rgba(30,27,75,.06)}
.stage>svg{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.panel{display:flex;flex-direction:column;gap:10px;min-height:0}
.prompt{background:#fff;border-radius:var(--r);padding:12px 14px;border-left:8px solid var(--c)}
.prompt h2{margin:0;font-size:25px;line-height:1.15}
.prompt p{margin:4px 0 0;color:var(--muted);font-size:17px}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start}
.controls .qopts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;width:100%}
.controls .qopts .btn{justify-content:flex-start;text-align:left;overflow-wrap:normal;word-break:normal;hyphens:none}
.controls .qopts.row{display:flex;flex-wrap:wrap;gap:10px}
.controls .qopts.row .btn{flex:1 1 0;min-width:64px;justify-content:center;text-align:center}
/* answer list always spans the full controls width (was stuck in one half-width grid cell on .act.playfull) */
.controls>.qopts,.act.playfull .controls>.qopts{grid-column:1/-1;width:100%;box-sizing:border-box}
@media (max-width:560px){.controls .qopts{grid-template-columns:1fr;gap:8px}.controls .qopts.row{display:flex}
 .controls .qopts.two{grid-template-columns:repeat(2,minmax(0,1fr))}
 .controls .qopts.two .btn:last-child:nth-child(odd){grid-column:1/-1}
 .controls .qopts .btn{min-height:52px;padding:8px 12px;font-size:clamp(16px,4.6vw,19px)}}
.btn{padding:10px 18px;border-radius:16px;background:#fff;border:3px solid #C4B5FD;font-weight:600;font-size:21px;min-height:58px;box-shadow:0 4px 0 #C4B5FD;display:inline-flex;align-items:center;gap:8px;justify-content:center;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #C4B5FD}
.btn svg{width:40px;height:30px}
.btn.go{background:var(--green);border-color:var(--green);color:#fff;box-shadow:0 4px 0 #166534}
.btn.primary{background:var(--purple);border-color:var(--purple);color:#fff;box-shadow:0 4px 0 #4C1D95}
.btn.good{background:#DCFCE7;border-color:var(--green);box-shadow:0 4px 0 #86EFAC}
.btn.bad{background:#FFE4E6;border-color:#FB7185;box-shadow:0 4px 0 #FECDD3;animation:shake .4s;opacity:.75}
.btn.sel{background:#EDE9FE;border-color:var(--purple);box-shadow:0 4px 0 #7C3AED}
.btn.wide{flex:1 1 100%}
.btn.next{flex:0 0 auto;font-size:21px;animation:pop .35s;min-width:132px;max-width:220px;width:auto;justify-self:center;align-self:center;grid-column:1/-1}
.btn[disabled]{cursor:default}
.mascot-row{margin-top:auto;display:flex;align-items:flex-end;gap:6px}
.bubble{flex:1;background:#fff;border-radius:20px 20px 20px 6px;padding:10px 14px;font-size:19px;min-height:62px;border:3px solid #DDD6FE;display:flex;align-items:center}
.bubble.good{border-color:#4ADE80;background:#F0FDF4}
.bubble.hint{border-color:#FBBF24;background:#FFFBEB}
.mascot{width:84px;height:84px;flex:none;overflow:visible}
.polly{transform-box:fill-box;transform-origin:50% 90%}
.mascot.happy .polly{animation:hop .7s}
.mascot.think .polly{animation:tilt .9s}
.mascot.bob .polly{animation:bob 3s ease-in-out infinite}
.counter{font-size:20px;font-weight:600;background:#fff;border-radius:14px;padding:8px 12px;flex:1 1 100%}
.readout{background:#fff;border-radius:16px;padding:10px 14px;flex:1 1 100%;display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:19px}
.readout b{font-size:28px;display:block}
.readout .big{grid-column:1/-1;font-size:30px;font-weight:700;text-align:center;color:var(--green)}
/* sorter */
.sorter{display:flex;flex-direction:column;width:100%;padding:10px;gap:10px}
.tray{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-content:center;flex:1;min-height:120px}
.tile{width:104px;height:104px;background:#F8FAFC;border-radius:18px;border:3px solid #E2E8F0;touch-action:none;cursor:grab;display:grid;place-items:center;position:relative;z-index:1;animation:pop .35s backwards}
.tile svg{width:92%;height:92%;pointer-events:none}
.tile.dragging{z-index:50;box-shadow:0 14px 24px rgba(30,27,75,.25);cursor:grabbing;border-color:#A78BFA}
.tile.sel{border-color:var(--purple);box-shadow:0 0 0 5px #DDD6FE}
.bins{display:grid;gap:10px}
.bin{border:4px dashed #A78BFA;border-radius:18px;min-height:170px;background:#FAF5FF;padding:6px;display:flex;flex-direction:column;gap:4px;cursor:pointer;transition:background .2s}
.bin-label{font-weight:700;text-align:center;font-size:19px;line-height:1.1}
.bin-label small{display:block;font-weight:500;color:var(--muted);font-size:15px}
.bin-items{display:flex;flex-wrap:wrap;gap:4px;justify-content:center}
.bin .tile{width:56px;height:56px;border-width:2px;cursor:default;border-radius:12px}
.bin.over{background:#EDE9FE;border-style:solid}
.bin.shake{animation:shake .45s;background:#FFF1F2;border-color:#FB7185}
/* keypad */
.keypad{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;flex:1 1 100%;width:100%;box-sizing:border-box}
.kp-display{grid-column:1/-1;background:#fff;border-radius:16px;border:3px solid #C4B5FD;font-size:34px;font-weight:700;text-align:center;padding:4px;min-height:58px}
.kp-display .kp-unit{font-size:20px;color:var(--muted);font-weight:500}
.key{min-height:56px;font-size:26px;border-radius:14px;background:#fff;font-weight:700;box-shadow:0 4px 0 #DDD6FE}
.key:active{transform:translateY(3px);box-shadow:0 1px 0 #DDD6FE}
.key.ok{background:var(--green);color:#fff;box-shadow:0 4px 0 #166534;font-size:22px}
.key.del{font-size:20px}
/* svg bits */
.pulse{animation:pulse 1.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.popin{animation:pop .35s backwards;transform-box:fill-box;transform-origin:center}
.checker{cursor:grab}
.checker.lift{filter:drop-shadow(0 3px 3px rgba(0,0,0,.3))}
.hit{cursor:pointer}
/* modal & toast */
.modal-bg{position:fixed;inset:0;background:rgba(30,27,75,.55);display:grid;place-items:center;z-index:100;animation:fade .25s}
.modal{background:#fff;border-radius:26px;padding:20px;max-width:460px;width:92%;text-align:center;animation:pop .4s}
.modal h2{margin:4px 0;font-size:32px;color:var(--purple)}
.modal .mascot{width:110px;height:110px}
.bigstars{font-size:62px;color:#E5E7EB;letter-spacing:6px}
.bigstars .on{color:#F59E0B;display:inline-block;animation:starIn .6s both}
.mbtns{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:10px}
.modal input{font:inherit;font-size:28px;width:140px;text-align:center;border:3px solid #C4B5FD;border-radius:14px;padding:6px;margin:6px}
.toast{position:fixed;top:4px;left:50%;transform:translateX(-50%);background:#fff;border:4px solid var(--sun);border-radius:20px;padding:8px 18px 8px 10px;display:flex;gap:10px;align-items:center;z-index:150;animation:drop .5s;box-shadow:0 10px 30px rgba(0,0,0,.2)}
.toast small{display:block;color:var(--muted);font-size:14px}
.toast b{font-size:21px}
.toast.out{opacity:0;transition:opacity .4s}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:200}
/* progress */
.prog{padding:10px;display:flex;flex-direction:column;gap:10px}
.box{background:#fff;border-radius:var(--r);padding:12px 14px}
.box h2{margin:0 0 8px;font-size:24px}
.statrow{display:flex;gap:8px;flex-wrap:wrap}
.stat{flex:1;min-width:130px;background:#F5F3FF;border-radius:14px;padding:8px 12px;font-size:16px;color:var(--muted)}
.stat b{display:block;font-size:30px;color:var(--ink)}
.topic{display:grid;grid-template-columns:44px 1fr auto;gap:4px 10px;align-items:center;padding:6px 0;border-bottom:2px solid #F3F4F6}
.topic svg{width:44px;height:44px;grid-row:span 2}
.topic .nm{font-weight:600;font-size:19px}
.topic .lv{font-size:15px;color:var(--muted);text-align:right}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.badge{background:#F5F3FF;border-radius:16px;padding:10px;text-align:center;font-size:14px;color:var(--muted)}
.badge b{display:block;font-size:17px;color:var(--ink)}
.badge svg{width:64px;height:64px}
.badge.locked{opacity:.55;filter:grayscale(1)}
.grown{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
@keyframes pop{0%{transform:scale(.5);opacity:0}70%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
@keyframes hop{0%,100%{transform:translateY(0) scale(1)}30%{transform:translateY(-16px) scale(1.05,.95)}60%{transform:translateY(0) scale(1.08,.92)}}
@keyframes tilt{0%,100%{transform:rotate(0)}30%{transform:rotate(-9deg)}70%{transform:rotate(7deg)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.25);opacity:.6}}
@keyframes starIn{0%{transform:scale(0) rotate(-90deg)}70%{transform:scale(1.3) rotate(10deg)}100%{transform:scale(1)}}
@keyframes fade{from{opacity:0}}
@keyframes drop{0%{transform:translate(-50%,-80px)}70%{transform:translate(-50%,8px)}100%{transform:translate(-50%,0)}}
@media (max-width:1000px){.cards{grid-template-columns:repeat(2,1fr)}}
@media (max-width:900px){
 .actscreen{height:auto;min-height:100%}.panel{overflow:visible}
 .act{grid-template-columns:1fr;grid-template-rows:auto auto;align-content:start}
 .stage{min-height:380px}
 .stage.ar{min-height:0;aspect-ratio:var(--ar);max-height:58vh;width:100%}
 .keypad{grid-template-columns:repeat(3,minmax(0,1fr))}
 .key{min-height:60px}
 .mascot{width:70px;height:70px}
 .brand{font-size:19px}
}
@media (max-width:560px){.cards{grid-template-columns:1fr}.brand span{display:none}.dots{margin-left:0}}
@media (max-width:560px){
 body{font-size:16px}
 .topbar{padding:5px 6px;gap:5px}.pill{font-size:15px;padding:4px 8px}.pill svg{width:18px;height:18px}.iconbtn{width:42px;height:42px}
 .hero{padding:10px 12px;gap:10px}.hero .mascot{width:68px;height:68px}.hero h1{font-size:26px}.hero p{font-size:16px}
 .actbar{gap:6px;padding:6px}.act-title{font-size:20px}.back{min-height:44px;padding:6px 10px}
 .levels{width:100%;order:5}.lvl{flex:1;font-size:13px;padding:4px 4px;min-height:44px}
 .act{padding:0 6px 8px;gap:8px}
 .stage{min-height:330px}
 .stage.ar{min-height:0}
 .keypad{grid-template-columns:repeat(3,minmax(0,1fr))}
 .stat{min-width:0;flex:1 1 40%}
 .prompt{padding:8px 10px}.prompt h2{font-size:20px}.prompt p{font-size:15px}
 .btn{font-size:18px;min-height:52px;padding:8px 12px}.btn svg{width:32px;height:24px}
 .bubble{font-size:16px;min-height:52px;padding:8px 10px}.mascot{width:56px;height:56px}
 .tile{width:70px;height:70px;border-radius:14px}.tray{gap:6px;min-height:90px}.sorter{padding:6px;gap:6px}
 .bin{min-height:110px;padding:4px}.bin-label{font-size:15px}.bin-label small{font-size:12px}.bin .tile{width:38px;height:38px}
 .key{min-height:52px;font-size:22px}.key.ok{font-size:16px}.key.del{font-size:15px}.kp-display{font-size:28px;min-height:50px}
 .readout{font-size:16px}.readout b{font-size:22px}.readout .big{font-size:24px}
 .stat b{font-size:24px}.stat{min-width:0;flex:1 1 40%}.topic{grid-template-columns:36px 1fr}.topic .lv{grid-column:2/-1;text-align:left}
 .badges{grid-template-columns:repeat(2,1fr)}
 .toast b{font-size:17px}
}
.ctl-label{flex:1 1 100%;font-weight:600;color:var(--muted);font-size:16px;margin-top:4px}
.sec{margin:4px 2px 0;font-size:22px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.sec small{font-size:15px;color:var(--muted);font-weight:500}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important}}

/* ===== playfull geometry: slim top bar, nearly full-width stage ===== */
.actscreen.playfull{height:100%;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch}
.actscreen.playfull .actbar{flex:none}
.act.playfull{display:flex;flex-direction:column;grid-template-columns:none;grid-template-rows:none;align-content:stretch;gap:8px;min-height:0;height:auto;flex:1 0 auto}
.act.playfull .stage{flex:1 1 auto;min-height:200px;width:100%;height:auto}
.act.playfull .stage.ar{aspect-ratio:unset;max-height:none;min-height:0;width:100%;flex:1 1 auto;height:auto}
.act.playfull .panel,.act.playfull .panel.slim{flex:none;display:flex;flex-direction:row;flex-wrap:nowrap;align-items:center;gap:8px;min-height:0;overflow:visible}
.act.playfull .prompt{flex:1 1 auto;min-width:0;padding:8px 14px;margin:0}
.act.playfull .prompt h2{font-size:22px;line-height:1.15}
.act.playfull .prompt p{font-size:16px;margin:2px 0 0}
.act.playfull .actionbar,.act.playfull .panel > .mascot-row{flex:0 1 42%;margin:0;flex-direction:row;align-items:center;gap:8px;max-width:46%;min-width:0}
.act.playfull .actionbar .mascot-row{margin:0;flex:1 1 auto;min-width:0;align-items:center}
.act.playfull .actionbar .mascot,.act.playfull .panel .mascot{width:56px;height:56px;flex:none}
.act.playfull .actionbar .bubble,.act.playfull .panel .bubble{min-height:0;max-height:none;overflow:visible;height:auto;font-size:16px;padding:8px 12px;line-height:1.35}
.act.playfull .abtns{flex:none}
.act.playfull .abtns .helpbtn{min-height:48px;padding:6px 12px;font-size:16px}
.act.playfull .actionbar{position:static;background:transparent;box-shadow:none;padding:0}
.act.playfull .controls{flex:0 0 auto;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;width:100%;align-content:start;min-height:0;overflow:visible}
.act.playfull .controls:empty{display:none}
.act.playfull .controls.row{display:flex;flex-wrap:nowrap;justify-content:center}
.act.playfull .controls.row .btn{flex:1 1 0;max-width:240px}
.act.playfull .controls .btn{min-height:56px;font-size:20px}
@media (max-height:650px){.act.playfull .controls{gap:6px}.act.playfull .controls .btn{min-height:48px;font-size:18px;padding:6px 12px}}
/* sorter fills the stage and scales */
.act.playfull .sorter{height:100%;min-height:0;padding:10px;gap:12px;box-sizing:border-box}
.act.playfull .tray{flex:1 1 auto;min-height:0;gap:14px;align-content:center;justify-content:center}
.act.playfull .bins{flex:1 1 auto;min-height:0;height:auto;gap:12px;align-items:stretch}
.act.playfull .bin{min-height:0;height:100%;padding:8px;gap:6px;display:flex;flex-direction:column;overflow:hidden}
.act.playfull .bin-label{flex:0 0 auto;position:relative;z-index:2;background:#FAF5FF;padding:2px 4px 6px;font-size:20px}
.act.playfull .bin-items{flex:1 1 auto;min-height:0;overflow:auto;align-content:safe center;align-items:center;justify-content:center;gap:8px}
.act.playfull .sorter.bottom.tray-empty{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr)}
.act.playfull .sorter.bottom.tray-empty .tray{display:none}
.act.playfull .sorter.bottom.tray-empty .bins{height:100%;min-height:0}

function markLearned(id){
  if(!st.learned)st.learned={};
  if(!st.learned[id]){st.learned[id]=Date.now();st.points+=5;save();updateHud();checkBadges()}
}
function showLearn(startId){
  closeModal();keyHandler=null;run=null;main.innerHTML='';main.scrollTop=0;
  if(!st.learned)st.learned={};
  let i=LESSONS.findIndex(L=>L.id===startId);
  if(i<0)i=0;
  const shell=h('div',{class:'learnshell'});
  const side=h('nav',{class:'lside'});
  const chips=h('div',{class:'lchips'});
  const mainCol=h('div',{class:'lmain'});
  function go(to,done){
    if(sfx&&sfx.tap)sfx.tap();
    markLearned(LESSONS[i].id);
    if(done){showHome();return}
    i=to;draw();
  }
  function item(L,idx){
    const done=!!st.learned[L.id];
    return h('button',{class:'litem'+(idx===i?' on':'')+(done?' done':''),'data-id':L.id,onclick:()=>go(idx)},
      h('span',{class:'dot'},done?'✓':String(idx+1)),
      h('span',{},L.title));
  }
  function draw(){
    const L=LESSONS[i];
    side.innerHTML='';side.append(h('h3',{},'Lessons'),...LESSONS.map((X,idx)=>item(X,idx)));
    chips.innerHTML='';chips.append(...LESSONS.map((X,idx)=>item(X,idx)));
    const head=h('div',{class:'lhead'},
      h('button',{class:'back',onclick:()=>{markLearned(LESSONS[i].id);showHome()}},'◀ Home'),
      h('b',{},L.title),
      h('span',{class:'pill'},`${i+1} of ${LESSONS.length}`)
    );
    const vis=frag(L.visual());
    if(vis)vis.setAttribute('aria-hidden','true');
    const body=h('div',{class:'lbody'},
      h('section',{class:'lsec idea'},h('h3',{},'Big idea'),h('p',{},L.idea)),
      h('section',{class:'lsec visual'},vis),
      h('section',{class:'lsec example'},h('h3',{},'Quick example'),h('p',{},L.example)),
      h('section',{class:'lsec tip'},h('h3',{},'Tip'),h('p',{},L.tip))
    );
    const prev=h('button',{class:'btn',disabled:i===0,onclick:()=>{if(i>0)go(i-1)}},'◀ Back');
    const next=i<LESSONS.length-1
      ?h('button',{class:'btn go',onclick:()=>go(i+1)},'Next ▶')
      :h('button',{class:'btn go',onclick:()=>go(i,true)},'I got it! ★');
    const nav=h('div',{class:'lnav'},prev,h('span',{class:'spacer'}),next);
    mainCol.innerHTML='';mainCol.append(head,chips,body,nav);
    const on=chips.querySelector('.litem.on');if(on)on.scrollIntoView({inline:'center',block:'nearest',behavior:'instant'});
  }
  shell.append(side,mainCol);
  main.append(shell);
  draw();
}

/* ======================= Combine & Split (SOL 3.MG.4 f, g) ======================= */
const CS_NAME={3:'triangle',4:'quadrilateral',5:'pentagon',6:'hexagon'};
const CS_PLURAL={triangle:'triangles',quadrilateral:'quadrilaterals',pentagon:'pentagons',hexagon:'hexagons'};
const CS_PAL=['#FBCFE8','#BFDBFE','#FDE68A','#A7F3D0'];
/* Every scene: parts tile the outer shape exactly (no gaps, no overlaps). */
const CSCENES=[
 {parts:[[[40,60],[160,60],[40,140]],[[160,60],[160,140],[40,140]]],outer:[[40,60],[160,60],[160,140],[40,140]],cuts:[[[40,140],[160,60]]]},

 {parts:[[[60,60],[140,60],[140,140]],[[60,60],[140,140],[60,140]]],outer:[[60,60],[140,60],[140,140],[60,140]],cuts:[[[60,60],[140,140]]]},
 {parts:[[[60,60],[110,60],[110,160],[60,160]],[[110,60],[160,60],[160,160],[110,160]]],outer:[[60,60],[160,60],[160,160],[60,160]],cuts:[[[110,60],[110,160]]]},
 {parts:[[[130,60],[160,60],[160,90]],[[60,60],[130,60],[160,90],[160,160],[60,160]]],outer:[[60,60],[160,60],[160,160],[60,160]],cuts:[[[130,60],[160,90]]]},
 {parts:[[[60,150],[110,150],[110,60]],[[110,150],[160,150],[110,60]]],outer:[[60,150],[160,150],[110,60]],cuts:[[[110,60],[110,150]]]},
 {parts:[[[87.78,100],[132.22,100],[110,60]],[[60,150],[160,150],[132.22,100],[87.78,100]]],outer:[[60,150],[160,150],[110,60]],cuts:[[[87.78,100],[132.22,100]]]},
 {parts:[[[60,60],[100,60],[100,160],[60,160]],[[100,60],[140,60],[140,160],[100,160]],[[140,60],[180,60],[180,160],[140,160]]],outer:[[60,60],[180,60],[180,160],[60,160]],cuts:[[[100,60],[100,160]],[[140,60],[140,160]]]}
];
/* combine pools: pieces that are all 3 or 4 sided, outer 3..6 sides */
const CS_TWO=[0,1,2,3,4,6,7,9];            /* 2 pieces that push together */
const CS_THREE=[5,11];                      /* 3 pieces that push together */
const CS_SPLIT=[0,1,3,4,5,6,7,8,9,10,11];  /* wholes with cut lines to name */

function csCentroid(p){let x=0,y=0;p.forEach(q=>{x+=q[0];y+=q[1]});return[x/p.length,y/p.length]}
function csOffsets(parts,d){const oc=csCentroid(parts.flat());return parts.map(p=>{const c=csCentroid(p);let vx=c[0]-oc[0],vy=c[1]-oc[1];const l=Math.hypot(vx,vy)||1;return[vx/l*d,vy/l*d]})}
const csPts=p=>p.map(q=>q[0].toFixed(1)+','+q[1].toFixed(1)).join(' ');
function csFmt(names){const c={};names.forEach(n=>c[n]=(c[n]||0)+1);return Object.keys(c).sort((a,b)=>Object.values(CS_NAME).indexOf(a)-Object.values(CS_NAME).indexOf(b)).map(n=>c[n]>1?`${c[n]} ${CS_PLURAL[n]}`:n).join(' + ')}
function csPhrase(names){const c={};names.forEach(n=>c[n]=(c[n]||0)+1);const ks=Object.keys(c).sort();const w=['','a','two','three'];return ks.map(n=>c[n]>1?`${w[c[n]]} ${CS_PLURAL[n]}`:`a ${n}`).join(' and ')}
function csPiece(pts,fill,label,stroke){
 const g=s('g',{});g.append(s('polygon',{points:csPts(pts),fill,stroke:stroke?'#1E1B4B':'none','stroke-width':2.6,'stroke-linejoin':'round'}));
 if(label){const c=csCentroid(pts);g.append(s('text',{x:c[0].toFixed(1),y:(c[1]+4).toFixed(1),'text-anchor':'middle','font-size':11,'font-weight':800,fill:'#1E1B4B',stroke:'#fff','stroke-width':3,'paint-order':'stroke','pointer-events':'none'},label))}
 return g}
const csMove=(g,dx,dy,ms)=>{g.style.transition=`transform ${ms||.8}s ease`;g.style.transform=`translate(${dx.toFixed(1)}px,${dy.toFixed(1)}px)`};
function csChoices(api,correctLabel,options,onRight,onWrong){
 const bs=choiceButtons(options.map(o=>({v:o,label:cap(o)})),(v,b)=>{
  if(v===correctLabel){b.classList.add('good');const c=centerOf(b);onRight(c)}
  else{b.classList.add('bad');b.disabled=true;onWrong(v)}});
 return bs}

/* ---- Level 1: push pieces together, name the new shape ---- */
function csCombine(api,svg,pool){
 const sc=CSCENES[pick(pool)];const right=CS_NAME[sc.outer.length];
 const offs=csOffsets(sc.parts,17);const sh=Math.random()<.5?1:0;
 const gs=sc.parts.map((p,i)=>{const g=csPiece(p,CS_PAL[(i+sh)%4],null,true);g.style.transform=`translate(${offs[i][0].toFixed(1)}px,${offs[i][1].toFixed(1)}px)`;svg.append(g);return g});
 let joined=false;
 const join=()=>{if(joined)return;joined=true;gs.forEach(g=>csMove(g,0,0));setTimeout(()=>{if(!svg.isConnected)return;svg.append(s('polygon',{points:csPts(sc.outer),fill:'none',stroke:'#C026D3','stroke-width':4,'stroke-linejoin':'round','stroke-dasharray':'8 5',class:'popin'}))},850)};
 api.ask(`These ${sc.parts.length} pieces are pushed together edge to edge.`,'Picture the new outside shape. Count its outside sides, then tap its name.');
 csChoices(api,right,['triangle','quadrilateral','pentagon','hexagon'],c=>{join();api.good(`Count the outside edges: ${sc.outer.length}. The pieces make a ${right}!`,c.x,c.y)},v=>api.bad(`Not a ${v}. Count only the OUTSIDE edges once the pieces touch. Tap "Push together" to check!`));
 const pb=h('button',{class:'btn wide',id:'joinBtn'},'Push together ▶');pb.onclick=()=>{sfx.tap();join()};api.controls.append(pb);
 run.dbg={answer:right,parts:sc.parts.length}}

/* ---- Level 2: whole shape with cut lines, name the pieces ---- */
function csSplitNamed(api,svg){
 const sc=CSCENES[pick(CS_SPLIT)];const names=sc.parts.map(p=>CS_NAME[p.length]);const right=csFmt(names);
 const gs=sc.parts.map(p=>csPiece(p,'#EDE9FE','',false));gs.forEach(g=>svg.append(g));
 const outline=s('polygon',{points:csPts(sc.outer),fill:'none',stroke:'#1E1B4B','stroke-width':3,'stroke-linejoin':'round'});svg.append(outline);
 const cutEls=sc.cuts.map(([a,b])=>s('line',{x1:a[0],y1:a[1],x2:b[0],y2:b[1],stroke:'#C026D3','stroke-width':3,'stroke-dasharray':'6 4','stroke-linecap':'round'}));cutEls.forEach(l=>svg.append(l));
 const offs=csOffsets(sc.parts,15);
 const split=()=>{cutEls.forEach(l=>l.remove());outline.remove();gs.forEach((g,i)=>{g.innerHTML='';const p=sc.parts[i];const g2=csPiece(p,CS_PAL[i%4],cap(CS_NAME[p.length]),true);while(g2.firstChild)g.append(g2.firstChild);csMove(g,offs[i][0],offs[i][1])})};
 const pool=new Set([right]);const T=['triangle','quadrilateral','pentagon'];let guard=0;
 while(pool.size<4&&guard++<80){const k=names.length;const pick2=[];for(let i=0;i<k;i++)pick2.push(pick(T));pool.add(csFmt(pick2))}
 const opts=shuffle([...pool]);
 api.ask(sc.cuts.length>1?'Two straight cuts split this shape.':'One straight cut splits this shape.','Follow the dashed line. What are the pieces called?');
 csChoices(api,right,opts,c=>{split();api.good(`The cut makes: ${right}. Count each piece's sides to name it.`,c.x,c.y)},v=>api.bad(`Not ${v}. Look at each piece on its own and count its straight sides.`));
 run.dbg={answer:right}}

/* ---- Level 3: tap the cut that makes the target pieces (computed geometry) ---- */
function csCutPoly(P,a,b){
 const n=P.length,ring=[];
 for(let i=0;i<n;i++){ring.push({p:P[i],id:'v'+i});const q=P[(i+1)%n];ring.push({p:[(P[i][0]+q[0])/2,(P[i][1]+q[1])/2],id:'e'+i})}
 const ia=ring.findIndex(r=>r.id===a),ib=ring.findIndex(r=>r.id===b);
 const walk=(f,t)=>{const out=[];let i=f;for(;;){out.push(ring[i]);if(i===t)break;i=(i+1)%ring.length}return out};
 /* only keep midpoints that are cut ends: other edge midpoints are not real corners */
